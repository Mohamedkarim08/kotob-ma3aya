<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتبك معايا | المنصة التعليمية للكتب الخارجية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .nav-btn:hover {
            background-color: #0369a1;
        }
        header {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 30px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
        }
        .books-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .book-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            width: 260px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }
        .book-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .book-title {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .download-btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي (اللوحة والأزرار) -->
    <nav>
        <div class="logo">كتبك معايا</div>
        <div class="nav-links">
            <a href="#" class="nav-btn">الواجهة</a>
            <a href="#" class="nav-btn">لوحة الإدارة</a>
            <a href="#" class="nav-btn">قناة التليجرام</a>
        </div>
    </nav>

    <header>
        <h1>مرحباً بك في منصة كتبك معايا</h1>
        <p>حمل جميع الكتب الخارجية مجاناً وبدون أي مصاريف</p>
    </header>

    <div class="books-container">
        <!-- كتاب 1 -->
        <div class="book-card">
            <div class="book-title">كتاب الرياضيات للصف الأول الإعدادي</div>
            <a href="#" class="download-btn">تحميل الكتاب</a>
        </div>

        <!-- كتاب 2 -->
        <div class="book-card">
            <div class="book-title">كتاب العلوم للصف الثاني الإعدادي</div>
            <a href="#" class="download-btn">تحميل الكتاب</a>
        </div>

        <!-- كتاب 3 -->
        <div class="book-card">
            <div class="book-title">كتاب اللغة العربية للصف الثالث الإعدادي</div>
            <a href="#" class="download-btn">تحميل الكتاب</a>
        </div>
    </div>

</body>
</html>
